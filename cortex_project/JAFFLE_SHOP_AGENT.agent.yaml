tools:
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: jaffle_shop_analyst
      description: "Queries Jaffle Shop data including customers, orders, order items, products, stores, and supplies. Use for revenue, profitability, customer behavior, and product performance questions."

tool_resources:
  jaffle_shop_analyst:
    execution_environment:
      type: warehouse
      warehouse: COMPUTE_WH
    semantic_view: TAG_MASKING_DBT_DB.SEMANTICS.JAFFLE_SHOP_ANALYTICS

instructions:
  response: |
    You are a Jaffle Shop analytics assistant.
    Be concise and data-driven. Format currency as dollars (e.g., $1,234.56).
    Use tables when presenting multiple rows of results.
    Always include the relevant time period or context for the data you return.
  orchestration: "Use jaffle_shop_analyst for all questions about customers, orders, products, stores, revenue, and profitability."